<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Welfare & Investment Group</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="stylelogin.css" />
  </head>
  <body class="login-body">
    <div class="login-card">
      <div class="logo"><i class="fas fa-users"></i></div>
      <h1>Welfare & Investment Group</h1>
      <p class="tagline">Together We Grow</p>
      <h2>Welcome Back!</h2>
      <p class="subtitle">Login to access your account</p>

      <form id="loginForm" action="dashboard.html">
        <div class="form-group">
          <i class="fas fa-user"></i>
          <input
            type="text"
            id="memberNumber"
            placeholder="Member Number"
            required
          />
        </div>
        <div class="form-group">
          <i class="fas fa-lock"></i>
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
          <i class="fas fa-eye password-toggle" onclick="togglePassword()"></i>
        </div>
        <button type="submit" class="btn-login">Login</button>
        <p id="loginMessage" role="status"></p>
        <div class="options">
          <label><input type="checkbox" /> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
      </form>
      <div class="footer-text">
        <span>Secure</span> · <span>Reliable</span> · <span>Transparent</span>
      </div>
    </div>

    <script src="login.js"></script>
    <script src="app.js"></script>
  </body>
</html>
